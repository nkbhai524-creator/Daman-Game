<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Daman Game</title>
<meta name="description" content="Daman Game - Official website">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #2563eb);
    }

    .container {
      width: 90%;
      max-width: 420px;
      text-align: center;
      background: white;
      padding: 45px 25px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: block;
      object-fit: cover;
    }

    h1 {
      margin-bottom: 15px;
      color: #111827;
    }

    p {
      color: #555;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .login-btn {
      display: inline-block;
      padding: 14px 35px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
    }

    .login-btn:hover {
      opacity: 0.9;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

  <div class="container">

    <img
      src="daman-logo.jpg"
      alt="Daman Logo"
      class="logo"
    >

    <h1>Daman Game</h1>

    <p>
      Welcome! Tap the button below to continue.
    </p>

    <a
      class="login-btn"
      href="https://damanclub.in/#/register?invitationCode=6614813408731"
      target="_blank"
      rel="noopener noreferrer"
    >
      Login
    </a>

    <div class="footer">
      © 2026 Daman Game
    </div>

  </div>

</body>
</html>
